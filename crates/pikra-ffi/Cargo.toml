[package]
name = "pikra-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["lib", "staticlib"]
test = false

[dependencies]
pikra-schema.workspace = true
pikra-ai.workspace = true
pikra-agent.workspace = true
pikra-session.workspace = true
pikra-codemode.workspace = true
pikra-js.workspace = true
pikra-kit.workspace = true
pikra-tools = { path = "../pikra-tools", default-features = false, features = ["fs", "patch", "search", "sleep", "web-fetch"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
futures-executor.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
pikra-tools = { path = "../pikra-tools", default-features = false, features = ["shell", "monitor"] }
