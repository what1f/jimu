[package]
name = "pikra-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Harness-agnostic inline and fullscreen terminal UI with Grok Build rendering engine and optional Pikra native adapter"
build = "src/engine/markdown/assets/build.rs"

[lib]
test = false

[features]
# Default build is completely harness-agnostic with zero pikra-* dependencies.
default = ["syntax", "system-appearance", "history-search", "scrolling-regions"]
# Enable ratatui DECSTBM scrolling-regions optimization in inline mode.
scrolling-regions = ["ratatui/scrolling-regions"]
# Native in-process Pikra adapter (KitSession + AgentMiddleware + optional Process/Monitor task registry).
pikra = [
    "dep:pikra-kit",
    "dep:pikra-agent",
    "dep:pikra-session",
    "dep:pikra-ai",
    "dep:pikra-tools",
]
# Pure-Rust syntax highlighting for Markdown code fences and diffs (syntect with fancy-regex).
syntax = ["dep:syntect", "dep:anstyle-syntect", "dep:two-face"]
# System dark/light appearance probing (OSC11 + dark-light + COLORFGBG).
system-appearance = ["dep:dark-light"]
# Ctrl+R fuzzy input history search.
history-search = []
# Clipboard image reading and raster validation/resizing.
clipboard-image = ["dep:image"]
# Inline terminal image rendering (Kitty / iTerm2 graphics protocols).
inline-image = ["dep:image"]
# Pluggable Mermaid diagram rendering trait and subprocess timeout isolation.
mermaid = []

[target.'cfg(not(target_os = "ios"))'.dependencies]
# Optional Pikra native adapter dependencies (never compiled unless `pikra` feature is enabled).
pikra-kit = { workspace = true, optional = true }
pikra-agent = { workspace = true, optional = true }
pikra-session = { workspace = true, optional = true }
pikra-ai = { workspace = true, optional = true }
pikra-tools = { workspace = true, optional = true }

# Core rendering engine (aligned with Grok Build upstream versions for faithful migration).
ratatui.workspace = true
ratatui-core.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
anstyle.workspace = true
anstyle-parse.workspace = true
anstyle-lossy.workspace = true
html-escape.workspace = true
strum.workspace = true
supports-color.workspace = true
similar.workspace = true
vte.workspace = true
tui-scrollbar.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
unicode-bidi.workspace = true
unicode-bidi-mirroring.workspace = true
linkify.workspace = true
textwrap.workspace = true
regex.workspace = true
shellexpand.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
chrono.workspace = true
indexmap.workspace = true
sha2.workspace = true
futures-core.workspace = true
futures-util = { workspace = true, features = ["async-await-macro"] }
futures-channel.workspace = true

# Optional feature dependencies.
syntect = { workspace = true, optional = true }
anstyle-syntect = { workspace = true, optional = true }
dark-light = { workspace = true, optional = true }
image = { workspace = true, optional = true, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(all(unix, not(target_os = "ios")))'.dependencies]
libc = "0.2"

[build-dependencies]
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }

[dev-dependencies]
pikra-testkit.workspace = true
pikra-http.workspace = true
tokio.workspace = true
futures-executor.workspace = true

[[example]]
name = "pikra_tui"
required-features = ["pikra"]
