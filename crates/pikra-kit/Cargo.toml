[package]
name = "pikra-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
test = false

[features]
default = ["stdio"]
stdio = ["dep:tokio"]

[dependencies]
pikra-schema.workspace = true
pikra-ai.workspace = true
pikra-agent.workspace = true
pikra-session.workspace = true
pikra-codemode.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt"], optional = true }

[dev-dependencies]
pikra-testkit.workspace = true
futures-executor.workspace = true
tempfile.workspace = true
