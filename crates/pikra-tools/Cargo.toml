[package]
name = "pikra-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
test = false

[features]
default = ["web-fetch"]
web-fetch = ["dep:base64", "dep:chrono", "dep:ego-tree", "dep:scraper", "dep:url"]

[dependencies]
pikra-schema.workspace = true
pikra-ai.workspace = true
pikra-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-core.workspace = true
futures-util.workspace = true
tokio.workspace = true
thiserror.workspace = true
base64 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
ego-tree = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
pikra-testkit.workspace = true
