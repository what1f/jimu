[package]
name = "pikra-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
test = false

[features]
default = ["fs", "patch", "search", "shell"]
fs = ["dep:tempfile"]
patch = ["fs"]
search = ["dep:ignore", "dep:grep-searcher", "dep:grep-regex", "dep:grep-matcher", "dep:globset"]
shell = ["dep:tokio", "dep:libc"]

[dependencies]
pikra-schema.workspace = true
pikra-ai.workspace = true
pikra-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
ignore = { version = "0.4", optional = true }
grep-searcher = { version = "0.1", optional = true }
grep-regex = { version = "0.1", optional = true }
grep-matcher = { version = "0.1", optional = true }
globset = { version = "0.4", optional = true }

[target.'cfg(not(target_os = "ios"))'.dependencies]
tokio = { workspace = true, optional = true }

[target.'cfg(all(unix, not(target_os = "ios")))'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tempfile.workspace = true
pikra-testkit.workspace = true
futures-util.workspace = true
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
