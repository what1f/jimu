[package]
name = "jimu-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
test = false

[features]
default = ["stdio", "watch"]
stdio = ["dep:tokio"]
watch = ["dep:notify"]

[dependencies]
jimu-schema.workspace = true
jimu-ai.workspace = true
jimu-agent.workspace = true
jimu-session.workspace = true
jimu-codemode.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
futures-core.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt"], optional = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
notify = { workspace = true, optional = true }

[dev-dependencies]
jimu-testkit.workspace = true
futures-executor.workspace = true
tempfile.workspace = true
