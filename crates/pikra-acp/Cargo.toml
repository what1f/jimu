[package]
name = "pikra-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
test = false

[[bin]]
name = "pikra-acp"
path = "src/main.rs"
test = false

[dependencies]
agent-client-protocol-schema.workspace = true
pikra-schema.workspace = true
pikra-ai.workspace = true
pikra-http.workspace = true
pikra-agent.workspace = true
pikra-session.workspace = true
pikra-codemode.workspace = true
pikra-js.workspace = true
pikra-tools.workspace = true
pikra-kit = { workspace = true, features = ["stdio"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
base64.workspace = true
chrono.workspace = true
url.workspace = true
tempfile.workspace = true

[dev-dependencies]
# The reference SDK revision uses schema 1.21.0. The published 5.4.0 pins 1.19.0.
agent-client-protocol = { version = "5.4.0", git = "https://github.com/agentclientprotocol/rust-sdk.git", rev = "d9d2caea5247ee0350d98b9ef08cba5e5712754d", default-features = false, features = ["process", "stdio", "unstable"] }
pikra-testkit.workspace = true
tempfile.workspace = true
tokio-util = { version = "0.7", features = ["compat"] }
