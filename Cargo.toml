[workspace]
resolver = "2"
members = [
    "crates/jimu-schema",
    "crates/jimu-ai",
    "crates/jimu-http",
    "crates/jimu-agent",
    "crates/jimu-codemode",
    "crates/jimu-session",
    "crates/jimu-durable",
    "crates/jimu-js",
    "crates/jimu-tools",
    "crates/jimu-kit",
    "crates/jimu-ffi",
    "crates/jimu-testkit",
    "crates/jimu-tui",
    "apps/jimu",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
repository = "https://github.com/what1f/jimu"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
strip = "none"

[workspace.dependencies]
jimu-schema = { path = "crates/jimu-schema" }
jimu-ai = { path = "crates/jimu-ai" }
jimu-http = { path = "crates/jimu-http" }
jimu-agent = { path = "crates/jimu-agent" }
jimu-codemode = { path = "crates/jimu-codemode" }
jimu-session = { path = "crates/jimu-session" }
jimu-durable = { path = "crates/jimu-durable" }
jimu-js = { path = "crates/jimu-js" }
jimu-tools = { path = "crates/jimu-tools" }
jimu-kit = { path = "crates/jimu-kit", default-features = false }
jimu-ffi = { path = "crates/jimu-ffi" }
jimu-testkit = { path = "crates/jimu-testkit" }
jimu-tui = { path = "crates/jimu-tui", default-features = false }
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-widget-ref", "unstable-backend-writer", "scrolling-regions"] }
ratatui-core = "0.1"
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
anstyle = "1.0"
anstyle-parse = "0.2"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
html-escape = "0.2"
strum = { version = "0.27", features = ["derive"] }
supports-color = "3.0"
similar = "2.7"
vte = "0.15"
tui-scrollbar = "0.2"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.4"
linkify = "0.10"
textwrap = "0.16"
regex = "1"
dark-light = "2"
shellexpand = "3.1"
image = { version = "0.25", default-features = false }
agent-client-protocol-schema = { version = "1.21.0", default-features = false, features = ["unstable"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
bytes = "1.11"
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc", "sink", "std"] }
futures-channel = { version = "0.3", default-features = false, features = ["alloc", "sink", "std"] }
futures-executor = { version = "0.3", default-features = false, features = ["std", "thread-pool"] }
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.4"
uuid = { version = "1.18", features = ["v4", "v7"] }
rquickjs = { version = "0.14.0", features = ["futures", "loader", "parallel"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "net", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "rustls-tls-native-roots", "system-proxy"] }
scraper = { version = "0.25", default-features = false, features = ["atomic"] }
ego-tree = "0.10"
url = "2.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
indexmap = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "9"
tempfile = "3.27"
